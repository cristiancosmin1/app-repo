name: Build, Test and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: cristiancosmin/shopping-app
  INFRA_REPOSITORY: cristiancosmin1/infra-repo
  PYTHON_VERSION: "3.12"

jobs:

  # ============================================================
  # 1. QUALITY GATE
  # ============================================================

  quality:
    name: Lint, Tests and Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install quality tools
        run: |
          pip install pytest ruff pip-audit

      # ----------------------------------------------------------
      # Syntax validation
      # ----------------------------------------------------------

      - name: Validate Python syntax
        run: |
          python -m compileall -q app

      # ----------------------------------------------------------
      # Lint
      # ----------------------------------------------------------

      - name: Run Ruff
        run: |
          ruff check app tests

      # ----------------------------------------------------------
      # Unit / integration tests
      # ----------------------------------------------------------

      - name: Run tests
        run: |
          pytest -v tests \
            --junitxml=test-results.xml

      # ----------------------------------------------------------
      # Dependency security scan
      # ----------------------------------------------------------

      - name: Run dependency security scan
        run: |
          pip-audit \
            -r requirements.txt \
            --format=json \
            --output=pip-audit.json

      # ----------------------------------------------------------
      # Save artifacts even when debugging
      # ----------------------------------------------------------

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results
          path: |
            test-results.xml
            pip-audit.json
          if-no-files-found: ignore


  # ============================================================
  # 2. BUILD IMAGE
  # ============================================================

  build:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    needs:
      - quality

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # Build locally first.
      # Do NOT push before Trivy passes.
      # ----------------------------------------------------------

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------
      # Container vulnerability scan
      # Critical vulnerabilities block pipeline.
      # ----------------------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          format: template
          template: "@/contrib/sarif.tpl"
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

      # ----------------------------------------------------------
      # Push only after scan passes
      # ----------------------------------------------------------

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push \
            "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"


  # ============================================================
  # 3. GITOPS DEPLOY
  # ============================================================

  deploy:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo

      - name: Update Helm image tag
        shell: bash
        env:
          NEW_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          values_file = Path(
              "infra-repo/charts/shopping-app/values.yaml"
          )

          content = values_file.read_text()
          new_tag = os.environ["NEW_IMAGE_TAG"]

          updated, count = re.subn(
              r'(^image:\s*\n'
              r'\s+repository:\s*cristiancosmin/shopping-app\s*\n'
              r'\s+tag:\s*)["\']?[^"\'\n]+["\']?',
              rf'\1"{new_tag}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(
                  "Image tag could not be updated in values.yaml"
              )

          values_file.write_text(updated)
          PY

      - name: Commit infrastructure change
        working-directory: infra-repo
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No infrastructure change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/shopping-app/values.yaml

          git commit -m \
            "Deploy shopping-app ${{ needs.build.outputs.image_tag }}"

          git push


  # ============================================================
  # 4. POST-DEPLOY VALIDATION
  #
  # Requires a GitHub runner that can reach the EKS cluster.
  # ============================================================

  post-deploy:
    name: Post Deploy Validation
    runs-on: ubuntu-latest
    needs:
      - deploy

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region eu-central-1 \
            --name devops-levelup-staging-cluster

      # ----------------------------------------------------------
      # Wait for ArgoCD / Kubernetes deployment
      # ----------------------------------------------------------

      - name: Wait for Shopping deployment
        run: |
          kubectl rollout status \
            deployment/shopping-app \
            -n shopping \
            --timeout=300s

      - name: Show application pods
        if: always()
        run: |
          kubectl get pods -n shopping -o wide

      # ----------------------------------------------------------
      # Resolve LoadBalancer dynamically
      # ----------------------------------------------------------

      - name: Get ingress LoadBalancer
        id: ingress
        shell: bash
        run: |
          LB_HOSTNAME="$(
            kubectl get svc ingress-nginx-controller \
              -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          )"

          if [ -z "$LB_HOSTNAME" ]; then
            echo "Ingress LoadBalancer hostname not found."
            exit 1
          fi

          echo "hostname=$LB_HOSTNAME" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Smoke test
      # ----------------------------------------------------------

      - name: Smoke test health endpoint
        shell: bash
        run: |
          LB="${{ steps.ingress.outputs.hostname }}"

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve app.local:443:$(dig +short "$LB" | head -n1) \
            https://app.local/health

      # ----------------------------------------------------------
      # Get Alice password from AWS Secrets Manager
      # ----------------------------------------------------------

      - name: Load functional test credentials
        id: credentials
        shell: bash
        run: |
          ALICE_PASSWORD="$(
            aws secretsmanager get-secret-value \
              --secret-id devops-levelup/staging/keycloak-users \
              --region eu-central-1 \
              --query SecretString \
              --output text \
              | jq -r '.ALICE_PASSWORD'
          )"

          echo "::add-mask::$ALICE_PASSWORD"

          echo \
            "alice_password=$ALICE_PASSWORD" \
            >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Obtain Keycloak token
      # ----------------------------------------------------------

      - name: Obtain Keycloak access token
        id: token
        shell: bash
        env:
          ALICE_PASSWORD: ${{ steps.credentials.outputs.alice_password }}
        run: |
          LB="${{ steps.ingress.outputs.hostname }}"
          LB_IP="$(dig +short "$LB" | head -n1)"

          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --insecure \
              --resolve auth.local:443:"$LB_IP" \
              -X POST \
              https://auth.local/realms/devops-lvlup/protocol/openid-connect/token \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              -d grant_type=password \
              -d client_id=shopping-app \
              -d username=alice \
              --data-urlencode \
              "password=${ALICE_PASSWORD}"
          )"

          TOKEN="$(echo "$RESPONSE" | jq -r '.access_token')"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Could not obtain Keycloak access token."
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Functional GET
      # ----------------------------------------------------------

      - name: Functional test GET items
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          LB="${{ steps.ingress.outputs.hostname }}"
          LB_IP="$(dig +short "$LB" | head -n1)"

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve app.local:443:"$LB_IP" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://app.local/items \
            | tee functional-get-response.json

      # ----------------------------------------------------------
      # Functional POST
      # ----------------------------------------------------------

      - name: Functional test POST item
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          LB="${{ steps.ingress.outputs.hostname }}"
          LB_IP="$(dig +short "$LB" | head -n1)"

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve app.local:443:"$LB_IP" \
            -X POST \
            https://app.local/items \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "github-actions-functional-test",
              "quantity": 1
            }' \
            | tee functional-post-response.json

      # ----------------------------------------------------------
      # k6
      # ----------------------------------------------------------

      - name: Install k6
        run: |
          sudo gpg \
            -k

          sudo gpg \
            --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C780D0BDB1A69C86A2BDB23A37BB31D8D977C2BD

          echo \
            "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 performance baseline
        shell: bash
        env:
          KC_PASSWORD: ${{ steps.credentials.outputs.alice_password }}
        run: |
          LB="${{ steps.ingress.outputs.hostname }}"
          LB_IP="$(dig +short "$LB" | head -n1)"

          sudo sed -i \
            '/app\.local/d; /auth\.local/d' \
            /etc/hosts

          echo \
            "${LB_IP} app.local auth.local" \
            | sudo tee -a /etc/hosts

          mkdir -p performance/results

          k6 run \
            -e KC_USERNAME=alice \
            -e KC_PASSWORD="$KC_PASSWORD" \
            performance/shopping-test.js

      # ----------------------------------------------------------
      # Artifacts
      # ----------------------------------------------------------

      - name: Upload post-deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-results
          path: |
            functional-get-response.json
            functional-post-response.json
            performance/results/summary.json
            performance/results/summary.txt
          if-no-files-found: ignore

      # ----------------------------------------------------------
      # Debug info on failure
      # ----------------------------------------------------------

      - name: Collect Kubernetes debugging information
        if: failure()
        run: |
          mkdir -p debug

          kubectl get pods -A -o wide \
            > debug/pods.txt

          kubectl get applications -n argocd \
            > debug/argocd-applications.txt

          kubectl describe deployment shopping-app \
            -n shopping \
            > debug/shopping-deployment.txt

          kubectl logs \
            -n shopping \
            deployment/shopping-app \
            --tail=500 \
            > debug/shopping-app.log \
            2>&1 || true

      - name: Upload debugging artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-debug
          path: debug/
          if-no-files-found: ignore
