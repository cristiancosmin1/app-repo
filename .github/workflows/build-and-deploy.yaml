name: Build, Test and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: cristiancosmin/shopping-app
  INFRA_REPOSITORY: cristiancosmin1/infra-repo
  PYTHON_VERSION: "3.12"
  PYTHONPATH: "."

jobs:
  # ============================================================
  # 1. QUALITY GATE
  # ============================================================

  quality:
    name: Lint, Tests and Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install development and quality dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q app

      - name: Run Ruff
        run: |
          ruff check app tests

      - name: Run tests
        run: |
          pytest -v tests \
            --junitxml=test-results.xml

      - name: Run dependency security scan
        run: |
          pip-audit \
            -r requirements.txt \
            --format=json \
            --output=pip-audit.json

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results
          path: |
            test-results.xml
            pip-audit.json
          if-no-files-found: ignore

  # ============================================================
  # 2. BUILD AND IMAGE SECURITY
  # ============================================================

  build:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    needs:
      - quality

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          format: template
          template: "@/contrib/sarif.tpl"
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push \
            "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

  # ============================================================
  # 3. GITOPS DEPLOY
  # ============================================================

  deploy:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo

      - name: Update Helm image tag
        shell: bash
        env:
          NEW_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          values_file = Path(
              "infra-repo/charts/shopping-app/values.yaml"
          )

          content = values_file.read_text()
          new_tag = os.environ["NEW_IMAGE_TAG"]

          updated, count = re.subn(
              r'(^image:\s*\n'
              r'\s+repository:\s*cristiancosmin/shopping-app\s*\n'
              r'\s+tag:\s*)["\']?[^"\'\n]+["\']?',
              rf'\1"{new_tag}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(
                  "Image tag could not be updated in values.yaml"
              )

          values_file.write_text(updated)
          PY

      - name: Commit infrastructure change
        working-directory: infra-repo
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No infrastructure change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/shopping-app/values.yaml

          git commit -m \
            "Deploy shopping-app ${{ needs.build.outputs.image_tag }}"

          git push

  # ============================================================
  # 4. POST-DEPLOY VALIDATION
  # ============================================================

  post-deploy:
    name: Post Deploy Validation
    runs-on: ubuntu-latest
    needs:
      - deploy

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::691862618786:role/devops-levelup-github-actions
          aws-region: eu-central-1

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region eu-central-1 \
            --name devops-levelup-staging-cluster

      - name: Wait for Shopping deployment
        run: |
          kubectl rollout status \
            deployment/shopping-app \
            -n shopping \
            --timeout=300s

      - name: Show application pods
        if: always()
        run: |
          kubectl get pods -n shopping -o wide

      - name: Get ingress LoadBalancer
        id: ingress
        shell: bash
        run: |
          LB_HOSTNAME="$(
            kubectl get svc ingress-nginx-controller \
              -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          )"

          if [ -z "$LB_HOSTNAME" ]; then
            echo "Ingress LoadBalancer hostname not found."
            exit 1
          fi

          echo "hostname=$LB_HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: Resolve LoadBalancer IP
        id: ingress-ip
        shell: bash
        run: |
          LB="${{ steps.ingress.outputs.hostname }}"

          LB_IP="$(
            dig +short "$LB" \
              | grep -E '^[0-9.]+' \
              | head -n1
          )"

          if [ -z "$LB_IP" ]; then
            echo "Could not resolve LoadBalancer IP."
            exit 1
          fi

          echo "ip=$LB_IP" >> "$GITHUB_OUTPUT"

      # ========================================================
      # SMOKE TEST
      # ========================================================

      - name: Smoke test health endpoint
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve app.local:443:${{ steps.ingress-ip.outputs.ip }} \
            https://app.local/health

      # ========================================================
      # TEST CREDENTIALS
      # ========================================================

      - name: Load functional test credentials
        id: credentials
        shell: bash
        run: |
          ALICE_PASSWORD="$(
            aws secretsmanager get-secret-value \
              --secret-id devops-levelup/staging/keycloak-users \
              --region eu-central-1 \
              --query SecretString \
              --output text \
              | jq -r '.ALICE_PASSWORD'
          )"

          if [ -z "$ALICE_PASSWORD" ] || \
             [ "$ALICE_PASSWORD" = "null" ]; then
            echo "Alice password was not found."
            exit 1
          fi

          echo "::add-mask::$ALICE_PASSWORD"

          echo \
            "alice_password=$ALICE_PASSWORD" \
            >> "$GITHUB_OUTPUT"

      # ========================================================
      # KEYCLOAK TOKEN
      # ========================================================

      - name: Obtain Keycloak access token
        id: token
        shell: bash
        env:
          ALICE_PASSWORD: ${{ steps.credentials.outputs.alice_password }}
        run: |
          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --insecure \
              --resolve auth.local:443:${{ steps.ingress-ip.outputs.ip }} \
              -X POST \
              https://auth.local/realms/devops-lvlup/protocol/openid-connect/token \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              -d grant_type=password \
              -d client_id=shopping-app \
              -d username=alice \
              --data-urlencode \
              "password=${ALICE_PASSWORD}"
          )"

          TOKEN="$(echo "$RESPONSE" | jq -r '.access_token')"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Could not obtain Keycloak access token."
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      # ========================================================
      # FUNCTIONAL GET
      # ========================================================

      - name: Functional test GET items
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve app.local:443:${{ steps.ingress-ip.outputs.ip }} \
            -H "Authorization: Bearer ${TOKEN}" \
            https://app.local/items \
            | tee functional-get-response.json

      # ========================================================
      # FUNCTIONAL POST
      # ========================================================

      - name: Functional test POST item
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --resolve app.local:443:${{ steps.ingress-ip.outputs.ip }} \
            -X POST \
            https://app.local/items \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "github-actions-functional-test",
              "quantity": 1
            }' \
            | tee functional-post-response.json

      # ========================================================
      # K6 PERFORMANCE TEST
      # ========================================================

      - name: Install k6
        shell: bash
        run: |
          curl -fsSL https://dl.k6.io/key.gpg \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg \
              >/dev/null

          echo \
            "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list \
              >/dev/null

          sudo apt-get update
          sudo apt-get install -y k6

          k6 version

      - name: Configure local application hosts
        run: |
          sudo sed -i \
            '/app\.local/d; /auth\.local/d' \
            /etc/hosts

          echo \
            "${{ steps.ingress-ip.outputs.ip }} app.local auth.local" \
            | sudo tee -a /etc/hosts

      - name: Run k6 performance baseline
        shell: bash
        env:
          KC_PASSWORD: ${{ steps.credentials.outputs.alice_password }}
        run: |
          mkdir -p performance/results

          k6 run \
            -e KC_USERNAME=alice \
            -e KC_PASSWORD="$KC_PASSWORD" \
            performance/shopping-test.js

      # ========================================================
      # ARTIFACTS
      # ========================================================

      - name: Upload post-deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-results
          path: |
            functional-get-response.json
            functional-post-response.json
            performance/results/summary.json
            performance/results/summary.txt
          if-no-files-found: ignore

      # ========================================================
      # DEBUG ON FAILURE
      # ========================================================

      - name: Collect Kubernetes debugging information
        if: failure()
        run: |
          mkdir -p debug

          kubectl get pods -A -o wide \
            > debug/pods.txt || true

          kubectl get applications -n argocd \
            > debug/argocd-applications.txt || true

          kubectl describe deployment shopping-app \
            -n shopping \
            > debug/shopping-deployment.txt || true

          kubectl logs \
            -n shopping \
            deployment/shopping-app \
            --tail=500 \
            > debug/shopping-app.log \
            2>&1 || true

      - name: Upload debugging artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-debug
          path: debug/
          if-no-files-found: ignore
